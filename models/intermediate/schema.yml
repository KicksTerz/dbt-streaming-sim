version: 2

models:
  - name: int_stream_engagement
    description: "Engagement counts per stream, computed once from events so marts can reuse them. One row per stream, including streams with no events."
    columns:
      - name: stream_id
        description: "Primary key; one row per stream."
        tests:
          - unique
          - not_null
      - name: total_events
        description: "Number of events of any type on the stream. 0 if none."
      - name: unique_viewers
        description: "Distinct users with at least one view event on the stream."
      - name: unique_likes
        description: "Distinct users with at least one like event on the stream."
